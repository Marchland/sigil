name: Release image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SIGIL_PUBLIC_URL: https://sigil.test
  SIGIL_ME: https://sigil.test
  SIGIL_SERVICE_TOKEN: test-service-token
  SIGIL_HERALD_BASE_URL: https://herald.test
  SIGIL_GITHUB_CLIENT_ID: test-client-id
  SIGIL_GITHUB_CLIENT_SECRET: test-client-secret
  SPRING_PG_HOST: localhost
  SPRING_PG_PORT: "5432"
  SPRING_PG_DB: sigil
  SPRING_PG_USERNAME: postgres
  SPRING_PG_PASSWORD: postgres

jobs:
  image:
    name: Verify and build distroless image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full integration tests
        run: ./gradlew test

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Stage jar for docker
        run: cp build/libs/sigil.jar ./sigil.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jacobsandersen/sigil
          tags: |
            type=semver,pattern={{version}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
