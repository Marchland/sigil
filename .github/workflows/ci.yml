name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SIGIL_PUBLIC_URL: https://sigil.test
  SIGIL_INDIEAUTH_ME: https://sigil.test
  SIGIL_INDIEAUTH_SERVICE_TOKEN: test-service-token
  SIGIL_INDIEAUTH_HERALD_BASE_URL: https://herald.test
  SIGIL_INDIEAUTH_GITHUB_CLIENT_ID: test-client-id
  SIGIL_INDIEAUTH_GITHUB_CLIENT_SECRET: test-client-secret
  SPRING_PG_HOST: localhost
  SPRING_PG_PORT: "5432"
  SPRING_PG_DB: sigil
  SPRING_PG_USERNAME: postgres
  SPRING_PG_PASSWORD: postgres

jobs:
  integration:
    name: Full integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Run full test suite
        run: ./gradlew test
